<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover autorise l'affichage sous l'encoche et l'heure -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Météo Pro & Détaillée</title>
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c3e50">
  <!-- Meta tags spécifiques pour forcer le plein écran sur iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Météo">
  <!-- Bibliothèque pour la carte du monde -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/869/869869.png">
</head>

<body>

  <div id="weather-widget" role="region" aria-live="polite" aria-label="Prévisions météo actuelles">
    <!-- Contenu injecté dynamiquement -->
  </div>

  <!-- Canvas pour les animations météo en arrière-plan -->
  <canvas id="weather-canvas"></canvas>

  <!-- Bouton Toggle Plein Écran -->
  <button id="btn-fullscreen" class="btn-fullscreen" title="Plein écran">⛶</button>

  <div class="weather-card">

    <!-- Barre de recherche -->
    <div class="search-container">
      <div class="search-box">
        <input type="text" id="input-ville" placeholder="Rechercher une ville..." autocomplete="off">
        <button id="btn-rechercher" title="Rechercher">🔍</button>
        <button id="btn-geoloc" class="btn-geo" title="Me géolocaliser">📍</button>
        <button id="btn-map" class="btn-map" title="Ouvrir la carte du monde">🗺️</button>
      </div>
      <div id="suggestions-list" class="suggestions-list"></div>
    </div>
    <!-- Conteneur de la bannière d'alerte (masqué par défaut) -->
<div id="alert-banner" class="alert-banner" style="display: none;"></div>

    <!-- Barre des favoris -->
    <div id="favoris-bar" class="favoris-bar"></div>

    <p id="message-statut" class="status-message">Chargement...</p>

    <!-- Bloc météo principal -->
    <div id="bloc-meteo" class="weather-info" style="display: none;">

      <!-- En-tête de la ville avec étoile intégrée harmonieusement -->
      <div class="header-city">
        <div class="city-header-wrapper">
          <div id="ville" class="city-name">Paris</div>
          <button id="btn-toggle-favori" class="btn-fav" title="Favori">⭐</button>
        </div>
        <div id="date-heure" style="font-size: 0.8em; opacity: 0.9; margin-top: 2px;">--:--</div>
      </div>

      <div id="previsions-7-jours" class="previsions-grid"></div>

      <!-- Bloc Lune cliquable -->
      <div class="weather-card clickable" id="card-lune"
        style="margin-top: 8px; padding: 10px; display: flex; align-items: center; justify-content: space-between;"
        title="Voir les détails et prévisions lunaires">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span id="lune-icone" style="font-size: 1.5em;">🌕</span>
          <div>
            <div style="font-size: 0.8em; color: #7f8c8d;">Phase lunaire</div>
            <div id="lune-texte" style="font-weight: bold; font-size: 0.9em;">Pleine lune</div>
          </div>
        </div>
        <small style="color: #2980b9; font-size: 0.8em;">Détails 👆</small>
      </div>

      <!-- Bloc central cliquable pour voir le détail horaire -->
      <div id="hero-meteo" class="hero-meteo" title="Cliquez pour voir les prévisions heure par heure">
        <div id="icone" class="weather-icon">☀️</div>
        <div id="temperature" class="temp">22°C</div>
        <div id="description" class="description">Ciel dégagé</div>
        <small class="hint-click">👆 Voir l'évolution par heure</small>
      </div>

      <div id="alerte-pluie" class="alerte-pluie"></div>

      <!-- Conseils intelligents -->
      <div id="conseils-box" class="conseils-box"></div>
      <div id="stroller-badge" class="badge-stroller"
        style="margin-top: 8px; padding: 6px 10px; border-radius: 6px; font-weight: bold; display: inline-block; font-size: 0.85em;">
      </div>

      <!-- Grille interactive des détails -->
      <div class="details-grid">
        <div class="detail-item clickable" id="card-vent" title="Voir les détails du vent">
          <span class="detail-label">💨 Vent</span>
          <span id="vent" class="detail-value">-- km/h</span>
        </div>
        <div class="detail-item clickable" id="card-humidite" title="Voir les détails de l'air">
          <span class="detail-label">💧 Humidité</span>
          <span id="humidite" class="detail-value">--%</span>
        </div>
        <div class="detail-item clickable" id="card-soleil" title="Voir le lever et coucher du soleil">
          <span class="detail-label">🌅 Soleil</span>
          <span id="soleil-apercu" class="detail-value">--:--</span>
        </div>
        <div class="detail-item clickable" id="card-uv" title="Voir les détails UV">
          <span class="detail-label">☀️ Indice UV</span>
          <span id="indice-uv" class="detail-value">--</span>
        </div>
      </div>

    </div>
  </div>

  <!-- Fenêtre modale universelle pour les détails -->
  <div id="modal-details" class="modal" style="display: none;">
    <div class="modal-content">
      <span id="modal-close" class="modal-close">&times;</span>
      <h3 id="modal-titre">Détails</h3>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Fenêtre modale pour la Carte du Monde -->
  <div id="modal-map" class="modal" style="display: none;">
    <div class="modal-content"
      style="width: 95%; height: 80vh; max-width: 800px; display: flex; flex-direction: column; padding: 16px;">
      <span id="modal-map-close" class="modal-close" style="z-index: 100;">&times;</span>
      <h3 style="margin-bottom: 8px;">Carte & Fuseaux Horaires</h3>
      <div id="map-instructions" class="conseils-box"
        style="margin-bottom: 12px; font-size: 0.85em; text-align: center;">🌍
      </div>
      <div id="map-container" style="flex: 1; border-radius: 12px; background: #e0e0e0; z-index: 1;"></div>
    </div>
  </div>

  <script type="module" src="app.js?v=2"></script>
</body>

</html>
